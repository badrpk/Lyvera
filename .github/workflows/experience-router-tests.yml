name: Lyvera experience router tests

on:
  push:
    branches: [main]
    paths:
      - 'core/experience_router.py'
      - 'core/test_experience_router.py'
      - '.github/workflows/experience-router-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'core/experience_router.py'
      - 'core/test_experience_router.py'
      - '.github/workflows/experience-router-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experience-router:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run experience router tests
        working-directory: core
        run: python -m unittest test_experience_router -v
